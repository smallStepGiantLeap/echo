syntax = "proto3";

package echo.v1;

// EchoService is a small unary + streaming service.
service EchoService {
  // Echo returns the request. It has no side effects, so the mesh may retry it.
  rpc Echo(EchoRequest) returns (EchoResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
  }
  // Stream sends messages until the client goes away.
  rpc Stream(StreamRequest) returns (stream StreamResponse);
}

message EchoRequest {
  string message = 1;
}

message EchoResponse {
  string message = 1;
  string served_by = 2;
}

message StreamRequest {
  int32 interval_ms = 1;
  int64 resume_after_seq = 2;
}

message StreamResponse {
  int64 seq = 1;
}
