# service.yaml: the only configuration the echo team writes.
apiVersion: vikrant.smallstepgiantleap.dev/v1alpha1
kind: Service
metadata:
  name: echo
spec:
  language: go
  proto: proto/echo/v1/echo.proto
  authorizedCallers:             # who may call which methods (Istio, by mTLS identity)
    - service: smallStepGiantLeap/frontend
      methods: [echo.v1.EchoService/Echo]   # not Stream: the e2e proves that denial
  ingress:                       # who may connect (NetworkPolicy); keep in step with authorizedCallers
    - service: smallStepGiantLeap/frontend
  egress:                        # what echo may connect to; everything else is refused
    - service: smallStepGiantLeap/ledger
      methods: [ledger.v1.LedgerService/GetBalance]   # what echo asks ledger to authorize
  placement:
    avoid: [smallStepGiantLeap/ledger]
